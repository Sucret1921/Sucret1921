name: Custom Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Sucret1921
          outputs: |
            dist/snake.svg?color_snake=#00ff88&color_dot=#1D9E75&color_empty=#1a1a2e
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff88&color_dot=#0F6E56
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
